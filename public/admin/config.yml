backend:
  name: github
  repo: InaZench/ina-studio
  branch: main

media_folder: public/images/projects
public_folder: /images/projects

collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Client, name: client, widget: string }
      - { label: Year, name: year, widget: string }
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Case Number, name: caseNumber, widget: string }
      - { label: Format, name: format, widget: string }
      - { label: Tools, name: tools, widget: string, required: false }
      - { label: Delivery, name: delivery, widget: string }
      - { label: Objective, name: objective, widget: text }
      - { label: Hero Note, name: heroNote, widget: string }
      - { label: Hero Video, name: heroVideo, widget: file, required: false, media_folder: /public/videos/projects, public_folder: /videos/projects }
      - { label: Hero Video Label, name: heroLabel, widget: string, required: false }
      - { label: Hero Video Poster, name: heroPoster, widget: image, required: false, media_folder: /public/images/projects, public_folder: /images/projects }
      - { label: Vertical Video Poster, name: verticalPoster, widget: image, required: false, media_folder: /public/images/projects, public_folder: /images/projects }
      - { label: Vertical Video (9:16), name: verticalVideo, widget: file, required: false, media_folder: /public/videos/projects, public_folder: /videos/projects }
      - { label: Vertical Video Eyebrow, name: verticalEyebrow, widget: string, required: false }
      - { label: Vertical Video Title, name: verticalTitle, widget: string, required: false }
      - { label: Vertical Video Caption, name: verticalCaption, widget: string, required: false }
      - { label: Cover Image, name: coverImage, widget: file, required: false, media_folder: /public/images/projects, public_folder: /images/projects }
      - { label: Page Layout, name: pageLayout, widget: select, options: [classic, stacked], required: false, hint: "stacked — ролик, текст, вертикальный ролик, почта на молочном фоне" }
      - { label: Next Project (id), name: nextProject, widget: string, required: false, hint: "id следующего кейса, например goutte-d-aigue" }